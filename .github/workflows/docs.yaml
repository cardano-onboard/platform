name: Deploy Docs

# Builds the VitePress documentation site and deploys it to GitHub Pages.
# One-time setup on the repo: Settings → Pages → Source = "GitHub Actions".
# If you serve docs from a custom domain, set `base: '/'` in docs/.vitepress/config.mjs.

on:
  # Every push to main here is a release being merged, so the site is rebuilt on all of
  # them. A paths filter would work now that a release arrives as an ordinary merge with
  # ancestry behind it, rather than as the orphan commit GitHub had nothing to diff
  # against, but there is nothing for it to save: a release that changes no documentation
  # still changes the version this site prints, and a build costs a few seconds.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress release deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build docs
        run: npm run docs:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
